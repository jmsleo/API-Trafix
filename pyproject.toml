version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nzsnyn", email = "672023013@student.uksw.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis[hiredis]>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn>=0.52.1",
    "werkzeug>=3.1.8",
]

[project.scripts]
api-trafix = "api_trafix:main"

[build-system]
