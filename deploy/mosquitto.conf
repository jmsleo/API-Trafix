# API-Trafix main-server MQTT broker (mosquitto 2.x).
#
# Bind 1883 on all interfaces so the gate boards on the LAN can reach us.
# Authentication is required: the passwd file is generated from
# MQTT_USERNAME / MQTT_PASSWORD by deploy/mosquitto-entrypoint.sh.
# Retained messages and session state survive restarts via /mosquitto/data.

listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
user mosquitto
