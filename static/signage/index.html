<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signage Display</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; height: 100vh; width: 100vw; }
        #bg {
            position: fixed; inset: 0;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #000;
        }
        #label {
            position: fixed; bottom: 12px; left: 16px;
            font: 600 12px/1 sans-serif; letter-spacing: .1em;
            color: rgba(255,255,255,.5);
            text-shadow: 0 1px 3px rgba(0,0,0,.9);
        }
    </style>
</head>
<body>
    <div id="bg"></div>
    <div id="label"></div>
    <script>
        const GATE = new URLSearchParams(location.search).get('gate') || 'GT-1';
        const normalize = (raw) => { try { return new URL(raw).pathname; } catch { return raw; } };
        const bg = document.getElementById('bg');
        const label = document.getElementById('label');

        const es = new EventSource(`/api/signage/stream/${encodeURIComponent(GATE)}`);

        es.addEventListener('ads', (e) => {
            const ads = JSON.parse(e.data).ads || [];
            if (ads.length > 0) {
                bg.style.backgroundImage = `url(${normalize(ads[0].image_url)})`;
                label.textContent = ads[0].ads_name || '';
            }
        });

        es.addEventListener('idle', (e) => {
            const img = JSON.parse(e.data).image;
            if (img && img.image_url) {
                bg.style.backgroundImage = `url(${normalize(img.image_url)})`;
                label.textContent = img.ads_name || '';
            }
        });
    </script>
</body>
</html>
