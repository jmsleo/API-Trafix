services:
  db:
    image: postgres:17
    container_name: api-trafix-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: trafix
      POSTGRES_PASSWORD: trafix
      POSTGRES_DB: trafix
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: api-trafix-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  adminer:
    image: adminer:latest
    container_name: api-trafix-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  # Main-server MQTT broker for the gate boards. Credentials come from
  # MQTT_USERNAME / MQTT_PASSWORD in the project .env (compose substitutes
  # them here), so the API and the broker share the same config.
  mqtt:
    image: eclipse-mosquitto:2
    container_name: api-trafix-mqtt
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-bssparking}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-BCTDev_2025}
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./deploy/mosquitto-entrypoint.sh:/docker-entrypoint-custom.sh:ro
      - mqttdata:/mosquitto/data
      - mqttlog:/mosquitto/log

volumes:
  pgdata:
  redisdata:
  mqttdata:
  mqttlog:
